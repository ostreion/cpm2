name: proteinhunter
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - numpy>=1.26
  - pandas
  - scipy
  - matplotlib
  - biopython
  - rdkit
  - jupyter
  - ipykernel
  - pip
  - pip:
    - boltz>=2.2
    - chai-lab
    - torch>=2.0
    - pytorch-lightning
    - openmm
    - pyrosetta-installer
    - einops
    - hydra-core
    - omegaconf
    - wandb
    - tqdm
    - ProDy
    - py3Dmol
    - logmd
    - seaborn
